<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hinge Mechanism GLB Viewer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; color: #e0e0e0; font-family: monospace; overflow: hidden; }
  canvas { display: block; }
  #controls {
    position: fixed; top: 10px; left: 10px; z-index: 10;
    background: rgba(0,0,0,0.7); padding: 12px; border-radius: 6px;
    min-width: 260px;
  }
  #controls h3 { margin-bottom: 8px; color: #88aaff; }
  #controls label { display: block; margin: 6px 0 2px; font-size: 12px; }
  #controls select, #controls input[type=range] { width: 100%; }
  #controls input[type=range] { accent-color: #88aaff; }
  .slider-row { display: flex; align-items: center; gap: 8px; }
  .slider-row span { min-width: 36px; text-align: right; font-size: 11px; }
  #info {
    position: fixed; bottom: 10px; left: 10px; z-index: 10;
    background: rgba(0,0,0,0.7); padding: 8px 12px; border-radius: 4px;
    font-size: 11px; max-height: 200px; overflow-y: auto;
  }
  #camera-presets { display: flex; gap: 4px; margin-top: 8px; flex-wrap: wrap; }
  #camera-presets button {
    padding: 4px 8px; font-size: 11px; cursor: pointer;
    background: #333; color: #ddd; border: 1px solid #555; border-radius: 3px;
  }
  #camera-presets button:hover { background: #555; }
</style>
</head>
<body>

<div id="controls">
  <h3>Hinge Mechanism Viewer</h3>

  <label>Configuration:</label>
  <select id="config-select">
    <option value="pha-hirth" selected>PHA + Hirth 24T</option>
    <option value="pha-curvic">PHA + Curvic 36T</option>
    <option value="pha-serrated">PHA + Serrated 72T</option>
    <option value="bearing-hirth">Bearing + Hirth 24T</option>
    <option value="bearing-curvic">Bearing + Curvic 36T</option>
    <option value="bearing-serrated">Bearing + Serrated 72T</option>
  </select>

  <label>Fold Angle:</label>
  <div class="slider-row">
    <input type="range" id="fold-angle" min="0" max="180" value="0" step="1">
    <span id="fold-val">0°</span>
  </div>

  <label>Butterfly Angle:</label>
  <div class="slider-row">
    <input type="range" id="butterfly-angle" min="0" max="45" value="0" step="1">
    <span id="butterfly-val">0°</span>
  </div>

  <div id="camera-presets">
    <button data-pos="0,15,80" data-target="0,10,0">Front</button>
    <button data-pos="80,15,0" data-target="0,10,0">Side</button>
    <button data-pos="0,80,0" data-target="0,10,0">Top</button>
    <button data-pos="50,30,50" data-target="0,10,0">Iso</button>
  </div>
</div>

<div id="info">Loading...</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.164.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a2e);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 1000);
camera.position.set(50, 30, 50);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(devicePixelRatio);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 10, 0);
controls.enableDamping = true;

// Lighting
const ambient = new THREE.AmbientLight(0xffffff, 0.4);
scene.add(ambient);
const dir1 = new THREE.DirectionalLight(0xffffff, 1.0);
dir1.position.set(30, 50, 40);
scene.add(dir1);
const dir2 = new THREE.DirectionalLight(0x8888ff, 0.3);
dir2.position.set(-20, -10, 30);
scene.add(dir2);

// Grid helper (model is Y-up after glTF Z→Y conversion)
const grid = new THREE.GridHelper(200, 20, 0x444444, 0x333333);
scene.add(grid);

// Groups for animation
let centerGroup = new THREE.Group();
let leftGroup = new THREE.Group();
let rightGroup = new THREE.Group();

const PIVOT_Y = 8.8; // pivot center Z in model = Y in Three.js (after Z-up→Y-up)
const loader = new GLTFLoader();
const infoDiv = document.getElementById('info');

let currentModel = null;

function loadConfig(name) {
  infoDiv.textContent = `Loading ${name}.glb...`;

  if (currentModel) {
    scene.remove(currentModel);
    currentModel = null;
  }

  centerGroup = new THREE.Group();
  leftGroup = new THREE.Group();
  rightGroup = new THREE.Group();

  loader.load(
    `../output/${name}.glb`,
    (gltf) => {
      const model = gltf.scene;

      // The OCCT glTF writer puts a root transform node (with Z-up→Y-up rotation)
      // as the first child of the scene. All part nodes are children of that root.
      // We need to keep that root transform intact and insert our animation groups
      // underneath it.
      const rootXform = model.children[0]; // node with the coordinate rotation

      // Collect named part nodes (direct children of rootXform)
      const toGroup = [];
      if (rootXform) {
        // Snapshot children array since we'll mutate it
        const kids = [...rootXform.children];
        for (const child of kids) {
          const n = child.name;
          if (n && !n.endsWith('_mesh') &&
              (n.startsWith('center_') || n.startsWith('left_') || n.startsWith('right_'))) {
            toGroup.push(child);
          }
        }
      }

      // Reparent named subtrees into animation groups.
      // The groups become children of rootXform, inheriting its Z→Y rotation.
      const partNames = [];
      for (const node of toGroup) {
        const n = node.name;
        partNames.push(n);
        if (n.startsWith('center_')) centerGroup.add(node);
        else if (n.startsWith('left_')) leftGroup.add(node);
        else if (n.startsWith('right_')) rightGroup.add(node);
      }

      if (rootXform) {
        rootXform.add(centerGroup, leftGroup, rightGroup);
      }

      // Scale model from meters (glTF standard) to mm for comfortable viewing
      model.scale.setScalar(1000);

      // Add the full model (with root transform preserved) to scene
      currentModel = model;
      scene.add(currentModel);

      infoDiv.innerHTML = `<b>${name}</b> (${partNames.length} parts)<br>` +
        partNames.map(p => {
          const prefix = p.startsWith('center_') ? 'C' : p.startsWith('left_') ? 'L' : 'R';
          return `  [${prefix}] ${p}`;
        }).join('<br>');
    },
    (progress) => {
      if (progress.total) {
        infoDiv.textContent = `Loading ${name}: ${(progress.loaded/progress.total*100).toFixed(0)}%`;
      }
    },
    (error) => {
      infoDiv.textContent = `Error loading ${name}: ${error.message}`;
    }
  );
}

// Slider handlers
const foldSlider = document.getElementById('fold-angle');
const butterflySlider = document.getElementById('butterfly-angle');
const foldVal = document.getElementById('fold-val');
const butterflyVal = document.getElementById('butterfly-val');

// Pivot point in rootXform-local coords (model-space: Z-up, meters)
const PIVOT = new THREE.Vector3(0, 0, 0.0088); // Z = 8.8mm = 0.0088m

function buildPivotMatrix(foldRad, bflyRad) {
  // Build T × R × T⁻¹ matrix for rotation around pivot point.
  // In model space (Z-up): fold is around Y axis, butterfly is around Z axis.
  const T = new THREE.Matrix4().makeTranslation(PIVOT.x, PIVOT.y, PIVOT.z);
  const Tinv = new THREE.Matrix4().makeTranslation(-PIVOT.x, -PIVOT.y, -PIVOT.z);

  // Combined rotation: fold around Y, then butterfly around Z
  // Using Euler with order 'YZX' to apply fold (Y) first, then butterfly (Z)
  const R = new THREE.Matrix4().makeRotationFromEuler(
    new THREE.Euler(0, foldRad, bflyRad, 'YZX')
  );

  // Result = T × R × T⁻¹
  return new THREE.Matrix4().copy(T).multiply(R).multiply(Tinv);
}

function updateAngles() {
  const foldDeg = parseFloat(foldSlider.value);
  const bflyDeg = parseFloat(butterflySlider.value);
  foldVal.textContent = `${foldDeg}°`;
  butterflyVal.textContent = `${bflyDeg}°`;

  const foldRad = foldDeg * Math.PI / 180;
  const bflyRad = bflyDeg * Math.PI / 180;

  // Left half: fold = +angle/2, butterfly = +angle/2
  const leftMatrix = buildPivotMatrix(foldRad / 2, bflyRad / 2);
  leftGroup.matrix.copy(leftMatrix);
  leftGroup.matrixAutoUpdate = false;
  leftGroup.matrixWorldNeedsUpdate = true;

  // Right half: fold = -angle/2, butterfly = -angle/2
  const rightMatrix = buildPivotMatrix(-foldRad / 2, -bflyRad / 2);
  rightGroup.matrix.copy(rightMatrix);
  rightGroup.matrixAutoUpdate = false;
  rightGroup.matrixWorldNeedsUpdate = true;
}

foldSlider.addEventListener('input', updateAngles);
butterflySlider.addEventListener('input', updateAngles);

// Config selector
document.getElementById('config-select').addEventListener('change', (e) => {
  loadConfig(e.target.value);
});

// Camera presets
document.querySelectorAll('#camera-presets button').forEach(btn => {
  btn.addEventListener('click', () => {
    const pos = btn.dataset.pos.split(',').map(Number);
    const tgt = btn.dataset.target.split(',').map(Number);
    camera.position.set(...pos);
    controls.target.set(...tgt);
    controls.update();
  });
});

// Resize
window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// Animate
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

// Initial load
loadConfig('pha-hirth');
</script>
</body>
</html>
